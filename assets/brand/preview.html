<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weft mascot animation preview</title>
  <link rel="stylesheet" href="exports/palette.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:var(--weft-canvas);color:var(--weft-ink);font:16px/1.5 system-ui,sans-serif}main{max-width:600px;margin:auto;padding:32px 20px}h1{font:32px Georgia,serif;margin:0 0 8px}p{color:var(--weft-muted)}.stage{position:relative;width:100%;max-width:360px;aspect-ratio:1;margin:8px auto 20px}.stage img,.stage canvas{position:absolute;inset:0;display:block;width:100%;height:100%}.stage [hidden]{display:none}.controls{display:flex;gap:10px;flex-wrap:wrap}button{background:var(--weft-primary);color:var(--weft-primary-foreground);border:1px solid var(--weft-primary);border-radius:3px;font:inherit;padding:10px 18px;cursor:pointer}button:hover{background:var(--weft-primary-hover)}button:focus-visible,a:focus-visible{outline:2px solid var(--weft-primary);outline-offset:3px}button:disabled{opacity:.6;cursor:default}a{color:var(--weft-primary)}output{display:block;min-height:24px;margin:14px 0;color:var(--weft-muted)}nav{display:flex;gap:18px;flex-wrap:wrap;border-top:1px solid var(--weft-border);padding-top:20px}
  </style>
</head>
<body>
<main>
  <h1>Weft mascot</h1>
  <p>The weave forms on arrival. Replay it, or try a blink and wave.</p>
  <div class="stage">
    <img id="formation" width="640" height="640" alt="Weft's woven strands forming into its mascot">
    <canvas id="mascot" width="640" height="640" role="img" aria-label="Weft woven mascot expression preview" hidden></canvas>
  </div>
  <div class="controls">
    <button type="button" id="replay-weave">Replay weave</button>
    <button type="button" id="reverse-weave" disabled>Unweave</button>
    <button type="button" data-animation="idle" disabled>Idle</button>
    <button type="button" data-animation="blink" disabled>Blink</button>
    <button type="button" data-animation="wave" disabled>Wave</button>
  </div>
  <output id="status" aria-live="polite">Forming weave…</output>
  <p id="asset-error" role="alert" hidden></p>
  <nav aria-label="Mascot source assets">
    <a href="exports/weft-mascot-forming.svg">Formation animation</a>
    <a href="exports/weft-mascot-unweaving.svg">Reverse animation</a>
    <a href="exports/weft-mascot.png">Transparent PNG</a>
    <a href="exports/weft-mascot-sprites.png">Sprite sheet</a>
    <a href="source/weft-mascot-rig.svg">Layered SVG</a>
  </nav>
</main>
<script src="exports/weft-mascot-sprites.js"></script>
<script src="exports/weft-mascot-forming.js"></script>
<script>
'use strict';
const atlas=window.WEFT_MASCOT_ATLAS;
const intro={...window.WEFT_MASCOT_INTRO};
for(const key of ['image','reverse','empty','still'])intro[key]='exports/'+intro[key];
const canvas=document.getElementById('mascot'),ctx=canvas.getContext('2d');
const status=document.getElementById('status'),buttons=Array.from(document.querySelectorAll('[data-animation]'));
const formation=document.getElementById('formation'),assetError=document.getElementById('asset-error');
const reverseButton=document.getElementById('reverse-weave');
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
const sprite=new Image();
let ready=false,timer=null,mode='formation',generation=0,reversing=false;
function draw(name){
  if(!ready)return;
  const frame=atlas.frames[name];
  ctx.clearRect(0,0,640,640);
  ctx.drawImage(sprite,...frame.rect,320-frame.pivot[0],580-frame.pivot[1],frame.rect[2],frame.rect[3]);
}
function clearTimer(){if(timer!==null)clearTimeout(timer);timer=null;}
function stop(){
  clearTimer();generation++;formation.onload=null;
  const resting=reversing&&mode==='formation'?intro.empty:intro.still;
  if(formation.getAttribute('src')!==resting)formation.src=resting;
  reverseButton.disabled=mode==='formation'&&reversing;
  if(mode==='sprite')draw('idle');
  status.textContent=reducedMotion.matches?'Reduced motion: static preview':mode==='formation'?(reversing?'Unwoven':'Weave formed'):'Idle';
}
function formWeave(reverse=false){
  clearTimer();reversing=reverse;mode='formation';canvas.hidden=true;formation.hidden=false;reverseButton.disabled=true;
  if(reducedMotion.matches||document.hidden){stop();return;}
  const request=++generation;
  formation.onload=()=>{
    if(request!==generation||mode!=='formation')return;
    formation.onload=null;
    if(reducedMotion.matches||document.hidden){stop();return;}
    // Leave the last painted frame intact; no per-frame JavaScript is needed.
    timer=setTimeout(()=>{timer=null;status.textContent=reversing?'Unwoven':'Weave formed';reverseButton.disabled=reversing;},intro.duration_ms+100);
  };
  status.textContent=reversing?'Unweaving…':'Forming weave…';
  formation.src=(reversing?intro.reverse:intro.image)+'?play='+request;
}
function play(name){
  stop();mode='sprite';reversing=false;reverseButton.disabled=false;formation.hidden=true;canvas.hidden=false;draw('idle');
  status.textContent=reducedMotion.matches?'Reduced motion: static preview':'Idle';
  if(!ready||document.hidden||name==='idle'||reducedMotion.matches)return;
  const sequence=atlas.animations[name];
  status.textContent=name==='blink'?'Blinking':'Waving';
  let index=0;
  function next(){
    if(document.hidden||reducedMotion.matches){stop();return;}
    if(index===sequence.length){stop();return;}
    const step=sequence[index++];draw(step.frame);timer=setTimeout(next,step.duration_ms);
  }
  next();
}
buttons.forEach(button=>button.addEventListener('click',()=>play(button.dataset.animation)));
document.getElementById('replay-weave').addEventListener('click',()=>formWeave());
reverseButton.addEventListener('click',()=>formWeave(true));
sprite.onload=()=>{ready=true;buttons.forEach(button=>{button.disabled=false;});if(mode==='sprite')draw('idle');};
sprite.onerror=()=>{assetError.hidden=false;assetError.textContent='Expression sprites could not load. Keep the preview and assets in the same folder.';};
formation.onerror=()=>{
  if(mode!=='formation')return;
  clearTimer();formation.onload=null;
  assetError.hidden=false;assetError.textContent='The formation asset could not load.';
  if(formation.getAttribute('src')!==intro.still)formation.src=intro.still;
  status.textContent='Static preview';
};
formWeave();
sprite.src='exports/'+atlas.image;
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
window.addEventListener('pagehide',stop);
reducedMotion.addEventListener('change',stop);
</script>
</body>
</html>
